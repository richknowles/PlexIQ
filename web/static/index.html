<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlexIQ v3.2 - Smart Media Management</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-film"></i> PlexIQ v3.2</h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="showSettings()">
                        <i class="fas fa-cog"></i> Settings
                    </button>
                    <div class="status-indicator" id="statusIndicator">
                        <span class="status-dot"></span>
                        <span id="statusText">Ready</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Control Panel -->
            <section class="control-panel">
                <div class="panel-card">
                    <h2><i class="fas fa-database"></i> Library Controls</h2>
                    <div class="controls-grid">
                        <div class="control-group">
                            <label for="librarySelect">Library:</label>
                            <select id="librarySelect" class="select-input">
                                <option value="">Loading libraries...</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <button class="btn btn-primary" onclick="collectMetadata()">
                                <i class="fas fa-download"></i> Collect Metadata
                            </button>
                        </div>
                        <div class="control-group">
                            <button class="btn btn-primary" onclick="analyzeItems()" id="analyzeBtn" disabled>
                                <i class="fas fa-chart-line"></i> Analyze
                            </button>
                        </div>
                        <div class="control-group">
                            <button class="btn btn-danger" onclick="deleteItems()" id="deleteBtn" disabled>
                                <i class="fas fa-trash"></i> Delete (Dry-Run)
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Progress Bar -->
            <section class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">Processing...</div>
                </div>
            </section>

            <!-- Results Table -->
            <section class="results-section">
                <div class="panel-card">
                    <div class="card-header">
                        <h2><i class="fas fa-table"></i> Analysis Results</h2>
                        <div class="card-actions">
                            <button class="btn btn-sm btn-secondary" onclick="exportResults()">
                                <i class="fas fa-download"></i> Export
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="refreshResults()">
                                <i class="fas fa-sync"></i> Refresh
                            </button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="data-table" id="resultsTable">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Score</th>
                                    <th>Play Count</th>
                                    <th>Rating</th>
                                    <th>Size</th>
                                    <th>Age</th>
                                    <th>Recommended</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="resultsTableBody">
                                <tr>
                                    <td colspan="8" class="empty-state">
                                        <i class="fas fa-inbox"></i>
                                        <p>No analysis performed yet. Select a library and click "Collect Metadata" to begin.</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="summary-bar" id="summaryBar">
                        <span>No analysis performed yet</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="modal-close" onclick="closeSettings()">&times;</button>
            </div>
            <div class="modal-body" id="settingsContent">
                <!-- Settings content -->
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
