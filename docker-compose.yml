version: '3.8'

services:
  plexiq:
    build:
      context: .
      dockerfile: Dockerfile
    image: plexiq:3.2.0
    container_name: plexiq
    restart: unless-stopped

    # Environment variables (override with .env file)
    environment:
      - PLEX_URL=${PLEX_URL:-http://plex:32400}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - WEIGHT_PLAY_COUNT=${WEIGHT_PLAY_COUNT:-0.3}
      - WEIGHT_RATINGS=${WEIGHT_RATINGS:-0.25}
      - WEIGHT_SIZE=${WEIGHT_SIZE:-0.2}
      - WEIGHT_AGE=${WEIGHT_AGE:-0.15}
      - WEIGHT_QUALITY=${WEIGHT_QUALITY:-0.1}
      - MIN_DELETION_SCORE=${MIN_DELETION_SCORE:-0.7}
      - NEVER_DELETE_RATING_THRESHOLD=${NEVER_DELETE_RATING_THRESHOLD:-8.0}

    # Volumes for persistent data
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      # Optional: Mount Plex media directory (read-only for safety)
      # - /path/to/plex/media:/media:ro

    # Network configuration
    networks:
      - plexiq-network

    # Optional: GUI support via X11 forwarding
    # Uncomment these lines to enable GUI mode
    # environment:
    #   - DISPLAY=${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:ro
    #   - ${HOME}/.Xauthority:/home/plexiq/.Xauthority:ro

    # Default command (override as needed)
    # Examples:
    # docker-compose run --rm plexiq plexiq collect Movies --enrich
    # docker-compose run --rm plexiq plexiq analyze Movies --show-recommended
    # docker-compose run --rm plexiq plexiq delete Movies --dry-run
    command: ["plexiq", "--help"]

networks:
  plexiq-network:
    driver: bridge

volumes:
  plexiq-data:
    driver: local
